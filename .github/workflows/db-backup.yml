# Weekly encrypted backup of the production (Neon) database.
#
# Free database plans don't guarantee backups, so this keeps our own copy as a
# GitHub Actions artifact. The dump holds user emails and password hashes, and
# artifacts can be downloadable by others on public repos, so it is encrypted
# (AES-256, gpg symmetric) before upload.
#
# Setup (repo Settings → Secrets and variables → Actions):
#   NEON_DATABASE_URL   Neon direct connection string (same value as Render's DATABASE_URL)
#   BACKUP_PASSPHRASE   long random passphrase; store it in your password manager too
#
# Restore:
#   gpg --decrypt opshub-YYYYMMDD.dump.gpg > opshub.dump
#   pg_restore --clean --if-exists --no-owner --dbname "$TARGET_DATABASE_URL" opshub.dump

name: DB backup

on:
  schedule:
    - cron: "30 20 * * 0" # Sundays 20:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$NEON_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::NEON_DATABASE_URL / BACKUP_PASSPHRASE not set; skipping backup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump database
        if: steps.secrets.outputs.configured == 'true'
        # pg_dump must be at least the server's major version; 18 covers Neon's 14–18.
        run: |
          set -euo pipefail
          FILE="opshub-$(date -u +%Y%m%d).dump"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          docker run --rm -e NEON_DATABASE_URL -v "$PWD:/backup" postgres:18-alpine \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges \
                     --dbname "$NEON_DATABASE_URL" --file "/backup/'"$FILE"'"'
          ls -lh "$FILE"

      - name: Encrypt
        if: steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
              --passphrase-fd 0 --output "$FILE.gpg" "$FILE" <<< "$BACKUP_PASSPHRASE"
          shred -u "$FILE"

      - name: Upload
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}.gpg
          path: ${{ env.FILE }}.gpg
          retention-days: 90
          if-no-files-found: error
