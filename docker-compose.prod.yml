# Production-like stack: gunicorn API behind nginx, which serves the built SPA
# and proxies /api on the same origin. Only nginx is published.
#
#   cp .env.example .env              # set SECRET_KEY and POSTGRES_PASSWORD
#   docker compose -f docker-compose.prod.yml up --build -d
#   open http://localhost:8080
#
# This file targets a single host. TLS is expected to terminate in front of
# nginx (load balancer / ingress); for plain-HTTP localhost testing the
# HTTPS-only settings are relaxed below via env — remove those overrides when
# serving over HTTPS.

name: opshub-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: opshub
      POSTGRES_USER: opshub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opshub -d opshub"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      # POSTGRES_PASSWORD must be URL-safe (or percent-encoded) here.
      DATABASE_URL: postgres://opshub:${POSTGRES_PASSWORD}@db:5432/opshub
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      NUM_PROXIES: "1"
      RUN_MIGRATIONS: "1"
      SEED_DEMO: ${SEED_DEMO:-0}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      # Plain-HTTP localhost only. Set to True once TLS is in front of nginx.
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SESSION_COOKIE_SECURE: ${SECURE_COOKIES:-False}
      CSRF_COOKIE_SECURE: ${SECURE_COOKIES:-False}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_DEMO_PASSWORD: ${DEMO_USER_PASSWORD:-opshub-demo}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
